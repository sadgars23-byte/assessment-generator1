services:
  - type: web
    name: assessment-generator
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NITRO_PRESET
        value: render_com
      - key: NODE_VERSION
        value: "20.18.0"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
